name: Auto Sync Upstream

# 触发同步的条件
on:
  # 1. 定时触发（比如每天北京时间 0 点运行一次）
  schedule:
    - cron: '0 16 * * *'  # UTC 时间，相当于北京时间每天 00:00
  # 2. 允许在 GitHub 网页端手动触发
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest

    permissions:
      contents: write # 允许写入权限以推送更新

    steps:
      # 检出你仓库的代码
      - name: Checkout target repo
        uses: actions/checkout@v4

      # 使用开源 Action 同步上游仓库
      - name: Sync with Upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4.1
        with:
          upstream_sync_repo: 'ahonn/GRKit'  # 比如：octocat/Spoon-Knife
          upstream_sync_branch: 'main'               # 上游分支名称（如 main 或 master）
          target_branch: 'main'                # 你仓库同步的目标分支
          git_sync_وات: false
          test_mode: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check for updates
        run: |
          if [ "${{ steps.sync.has_updates }}" = "true" ]; then
            echo "有新代码同步成功！"
          else
            echo "已经是最新版本，无须同步。"
          fi
